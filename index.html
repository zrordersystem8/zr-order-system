<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZR Creative Studio - Order System</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f7f5fb;
  color:#333;
}

header{
  background:linear-gradient(135deg,#6d28d9,#9333ea);
  color:white;
  padding:24px 20px;
  border-radius:0 0 25px 25px;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.subtitle{
  margin-top:5px;
  opacity:.9;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-number{
  font-size:25px;
  font-weight:bold;
  color:#6d28d9;
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:20px;
}

h2{
  margin-top:0;
  color:#5b21b6;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary{
  width:100%;
  background:#6d28d9;
  color:white;
  margin-top:20px;
}

.btn-primary:hover{
  background:#5b21b6;
}

.order{
  border:1px solid #eee;
  border-radius:16px;
  padding:16px;
  margin-top:12px;
}

.order-number{
  font-size:18px;
  font-weight:bold;
  color:#6d28d9;
}

.order-info{
  margin-top:8px;
  line-height:1.7;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#ede9fe;
  color:#5b21b6;
  font-size:12px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.btn-print{
  background:#111827;
  color:white;
}

.btn-delete{
  background:#fee2e2;
  color:#b91c1c;
}

.checklist{
  margin-top:15px;
  background:#fafafa;
  padding:14px;
  border-radius:14px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:8px;
  margin:9px 0;
}

.check-item input{
  width:auto;
}

.remaining{
  background:#f3e8ff;
  padding:13px;
  border-radius:12px;
  margin-top:12px;
  font-weight:bold;
  color:#5b21b6;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
}

.search{
  margin-bottom:15px;
}

@media(max-width:600px){
  .dashboard{
    grid-template-columns:1fr;
  }

  .container{
    padding:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ZR</div>
  <div class="subtitle">
    CREATIVE STUDIO<br>
    Order & Production System
  </div>
</header>

<div class="container">

  <div class="dashboard">

    <div class="stat">
      <div>Total Order</div>
      <div class="stat-number" id="totalOrder">0</div>
    </div>

    <div class="stat">
      <div>Proses</div>
      <div class="stat-number" id="totalProcess">0</div>
    </div>

    <div class="stat">
      <div>Selesai</div>
      <div class="stat-number" id="totalDone">0</div>
    </div>

  </div>


  <div class="card">

    <h2>＋ Order Baru</h2>

    <label>Nama Customer</label>
    <input id="customer" placeholder="Nama customer">

    <label>No. WhatsApp</label>
    <input id="phone" placeholder="08xxxxxxxxxx">

    <label>Produk</label>
    <select id="product">
      <option>Buku Tulis Custom</option>
      <option>Jurnal Ramadhan</option>
      <option>Buku Kontrol Tahsin/Tahfidz</option>
      <option>Buku Doa & Hadis</option>
      <option>Flash Card</option>
      <option>Bookmark</option>
      <option>Undangan</option>
      <option>Souvenir</option>
      <option>Paperbag</option>
      <option>Produk Lainnya</option>
    </select>

    <label>Jumlah</label>
    <input id="qty" type="number" placeholder="Contoh: 1000">

    <label>Deadline</label>
    <input id="deadline" type="date">

    <label>Harga Total</label>
    <input id="total" type="number" placeholder="Rp">

    <label>DP / Sudah Dibayar</label>
    <input id="paid" type="number" placeholder="Rp">

    <div class="remaining">
      Sisa Pembayaran:
      <span id="remaining">Rp 0</span>
    </div>

    <label>Status Produksi</label>
    <select id="status">
      <option>Menunggu</option>
      <option>Produksi</option>
      <option>Finishing</option>
      <option>QC</option>
      <option>Selesai</option>
      <option>Diambil / Dikirim</option>
    </select>

    <label>Catatan Produksi</label>
    <textarea id="notes" placeholder="Catatan produksi..."></textarea>

    <div class="checklist">

      <b>Checklist Produksi</b>

      <div class="check-item">
        <input type="checkbox" id="fileFinal">
        <span>File sudah final</span>
      </div>

      <div class="check-item">
        <input type="checkbox" id="print">
        <span>Cetak</span>
      </div>

      <div class="check-item">
        <input type="checkbox" id="cut">
        <span>Potong</span>
      </div>

      <div class="check-item">
        <input type="checkbox" id="finish">
        <span>Finishing / Jilid</span>
      </div>

      <div class="check-item">
        <input type="checkbox" id="qc">
        <span>QC</span>
      </div>

      <div class="check-item">
        <input type="checkbox" id="packing">
        <span>Packing</span>
      </div>

    </div>

    <button class="btn-primary" onclick="saveOrder()">
      💾 SIMPAN ORDER
    </button>

  </div>


  <div class="card">

    <h2>📋 Daftar Order</h2>

    <input
      class="search"
      id="search"
      placeholder="🔍 Cari customer / nomor order / produk..."
      oninput="renderOrders()"
    >

    <div id="orders"></div>

  </div>

</div>


<script>

let orders = JSON.parse(localStorage.getItem("zrOrders")) || [];


function rupiah(number){

  return new Intl.NumberFormat("id-ID",{
    style:"currency",
    currency:"IDR",
    maximumFractionDigits:0
  }).format(number || 0);

}


function getNextNumber(){

  if(orders.length === 0){
    return "ZR-0001";
  }

  let numbers = orders.map(o=>{
    return parseInt(o.number.replace("ZR-","")) || 0;
  });

  let next = Math.max(...numbers) + 1;

  return "ZR-" + String(next).padStart(4,"0");

}


function updateRemaining(){

  let total = Number(document.getElementById("total").value) || 0;

  let paid = Number(document.getElementById("paid").value) || 0;

  let remaining = total - paid;

  if(remaining < 0) remaining = 0;

  document.getElementById("remaining").innerText = rupiah(remaining);

}


document.getElementById("total").addEventListener(
  "input",
  updateRemaining
);

document.getElementById("paid").addEventListener(
  "input",
  updateRemaining
);


function saveOrder(){

  let customer =
    document.getElementById("customer").value.trim();

  let phone =
    document.getElementById("phone").value.trim();

  let product =
    document.getElementById("product").value;

  let qty =
    Number(document.getElementById("qty").value) || 0;

  let deadline =
    document.getElementById("deadline").value;

  let total =
    Number(document.getElementById("total").value) || 0;

  let paid =
    Number(document.getElementById("paid").value) || 0;

  let status =
    document.getElementById("status").value;

  let notes =
    document.getElementById("notes").value.trim();


  if(!customer){

    alert("Nama customer belum diisi.");

    return;
  }


  if(!product){

    alert("Produk belum dipilih.");

    return;
  }


  let order = {

    number:getNextNumber(),

    customer:customer,

    phone:phone,

    product:product,

    qty:qty,

    deadline:deadline,

    total:total,

    paid:paid,

    remaining:Math.max(total-paid,0),

    status:status,

    notes:notes,

    checklist:{

      fileFinal:document.getElementById("fileFinal").checked,

      print:document.getElementById("print").checked,

      cut:document.getElementById("cut").checked,

      finish:document.getElementById("finish").checked,

      qc:document.getElementById("qc").checked,

      packing:document.getElementById("packing").checked

    },

    created:new Date().toLocaleString("id-ID")

  };


  orders.unshift(order);

  localStorage.setItem(
    "zrOrders",
    JSON.stringify(orders)
  );


  alert(
    "Order " + order.number + " berhasil disimpan! 🎉"
  );


  clearForm();

  renderOrders();

}


function clearForm(){

  document.getElementById("customer").value="";
  document.getElementById("phone").value="";
  document.getElementById("qty").value="";
  document.getElementById("deadline").value="";
  document.getElementById("total").value="";
  document.getElementById("paid").value="";
  document.getElementById("notes").value="";

  document.getElementById("status").value="Menunggu";

  document.querySelectorAll(
    ".checklist input"
  ).forEach(x=>x.checked=false);

  updateRemaining();

}


function renderOrders(){

  let box =
    document.getElementById("orders");

  let keyword =
    document.getElementById("search").value
    .toLowerCase();


  let filtered = orders.filter(o =>

    o.customer.toLowerCase().includes(keyword) ||

    o.number.toLowerCase().includes(keyword) ||

    o.product.toLowerCase().includes(keyword)

  );


  if(filtered.length === 0){

    box.innerHTML =
      '<div class="empty">Belum ada order.</div>';

  }else{

    box.innerHTML = filtered.map(o=>`

      <div class="order">

        <div class="order-number">
          ${o.number}
        </div>

        <span class="badge">
          ${o.status}
        </span>

        <div class="order-info">

          <b>Customer:</b>
          ${o.customer}<br>

          <b>Produk:</b>
          ${o.product}<br>

          <b>Jumlah:</b>
          ${o.qty}<br>

          <b>Deadline:</b>
          ${formatDate(o.deadline)}<br>

          <b>Total:</b>
          ${rupiah(o.total)}<br>

          <b>DP:</b>
          ${rupiah(o.paid)}<br>

          <b>Sisa:</b>
          ${rupiah(o.remaining)}

        </div>


        <div class="actions">

          <button
            class="btn-print"
            onclick="printOrder('${o.number}')">
            🖨️ Cetak Order Slip
          </button>

          <button
            class="btn-delete"
            onclick="deleteOrder('${o.number}')">
            🗑️ Hapus
          </button>

        </div>

      </div>

    `).join("");

  }


  document.getElementById("totalOrder")
    .innerText = orders.length;


  document.getElementById("totalProcess")
    .innerText =
      orders.filter(o =>
        o.status !== "Selesai" &&
        o.status !== "Diambil / Dikirim"
      ).length;


  document.getElementById("totalDone")
    .innerText =
      orders.filter(o =>
        o.status === "Selesai" ||
        o.status === "Diambil / Dikirim"
      ).length;

}


function formatDate(date){

  if(!date) return "-";

  let parts = date.split("-");

  return parts[2] + "/" +
         parts[1] + "/" +
         parts[0];

}


function deleteOrder(number){

  if(!confirm(
    "Yakin ingin menghapus order " +
    number +
    "?"
  )) return;


  orders =
    orders.filter(o =>
      o.number !== number
    );


  localStorage.setItem(
    "zrOrders",
    JSON.stringify(orders)
  );


  renderOrders();

}


function printOrder(number){

  let o =
    orders.find(x =>
      x.number === number
    );


  if(!o) return;


  let checklist = `

    <div class="check">

      <div>☐ File sudah final</div>
      <div>☐ Cetak</div>
      <div>☐ Potong</div>
      <div>☐ Finishing / Jilid</div>
      <div>☐ QC</div>
      <div>☐ Packing</div>

    </div>

  `;


  let printWindow =
    window.open("","_blank");


  printWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>${o.number}</title>

      <style>

        body{
          font-family:Arial;
          padding:25px;
          max-width:500px;
          margin:auto;
        }

        h1{
          margin-bottom:3px;
        }

        .line{
          border-top:1px solid #333;
          margin:15px 0;
        }

        .number{
          font-size:24px;
          font-weight:bold;
        }

        .check{
          line-height:2;
          margin-top:15px;
        }

        .notes{
          border:1px solid #999;
          padding:12px;
          min-height:70px;
          margin-top:10px;
        }

      </style>

    </head>

    <body>

      <h1>ZR CREATIVE STUDIO</h1>

      <div>
        Order & Production System
      </div>

      <div class="line"></div>

      <div class="number">
        ${o.number}
      </div>

      <div class="line"></div>

      <b>Customer</b><br>
      ${o.customer}<br><br>

      <b>No. WhatsApp</b><br>
      ${o.phone || "-"}<br><br>

      <b>Produk</b><br>
      ${o.product}<br><br>

      <b>Jumlah</b><br>
      ${o.qty}<br><br>

      <b>Deadline</b><br>
      ${formatDate(o.deadline)}<br><br>

      <b>Status</b><br>
      ${o.status}<br><br>

      <b>Total</b><br>
      ${rupiah(o.total)}<br><br>

      <b>DP</b><br>
      ${rupiah(o.paid)}<br><br>

      <b>Sisa</b><br>
      ${rupiah(o.remaining)}

      <div class="line"></div>

      <b>CHECKLIST PRODUKSI</b>

      ${checklist}

      <div class="line"></div>

      <b>CATATAN</b>

      <div class="notes">
        ${o.notes || "-"}
      </div>

      <br><br>

      <small>
        Dicetak dari ZR Creative Studio
      </small>

      <script>
        window.onload=function(){
          window.print();
        }
      <\/script>

    </body>

    </html>

  `);


  printWindow.document.close();

}


renderOrders();

</script>

</body>
</html>
