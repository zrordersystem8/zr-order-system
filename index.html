<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZR Creative Studio - Order System</title>
<style>
:root{
  --pink:#d92d73;--pink2:#f05a9d;--soft:#fff2f7;--ink:#29212a;
  --muted:#756b75;--line:#eadfe5;--green:#1f9d62;--orange:#e58b22;
  --red:#d63b3b;--purple:#7c4db8;--white:#fff;--shadow:0 8px 24px rgba(72,31,52,.08);
}
*{box-sizing:border-box} body{margin:0;background:#fff8fb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{max-width:1200px;margin:auto;padding:16px}
.header{background:linear-gradient(135deg,#fff,#ffeaf3);border:1px solid #f2d5e1;border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #111}
.header h1{font-size:21px;margin:0 0 4px}.header p{margin:0;color:var(--muted);font-size:13px}
.topbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:700}
.btn.primary{background:var(--pink);color:#fff}.btn.secondary{background:#fff;border:1px solid #e5d7df;color:var(--ink)}
.btn.dark{background:#30252d;color:#fff}.btn.danger{background:#fff0f0;color:var(--red);border:1px solid #f0caca}
.btn.green{background:var(--green);color:#fff}.btn.small{padding:8px 10px;border-radius:9px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow)}
.card .num{font-size:22px;font-weight:800}.card .lbl{font-size:11px;color:var(--muted);margin-top:3px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:17px;margin:0 0 14px}.filters{display:flex;gap:9px;flex-wrap:wrap}
.search{flex:1;min-width:210px;padding:11px 13px;border:1px solid var(--line);border-radius:11px}
select,input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.full{grid-column:1/-1}
.order{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px;background:#fff}
.orderhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.orderno{font-size:17px;font-weight:800;color:var(--pink)}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;font-size:12px}.meta div{background:#fff8fb;border-radius:9px;padding:8px}.meta b{display:block;margin-bottom:3px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}
.st-menunggu{background:#fff4cc;color:#946b00}.st-produksi{background:#e8f0ff;color:#315aa6}.st-finishing{background:#fff0dc;color:#a45b00}.st-qc{background:#efe7ff;color:#6941a5}.st-selesai{background:#e4f8ed;color:#19734a}.st-kirim{background:#e7f7f8;color:#18727a}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.money{font-variant-numeric:tabular-nums}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(35,24,31,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalbox{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.success{text-align:center}.success .big{font-size:44px}.success h2{color:var(--pink)}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.check{border:1px solid var(--line);padding:10px;border-radius:10px;background:#fff8fb}
.check input{width:auto;margin-right:7px}.summary{background:#fff7fa;border:1px solid #f0dce6;border-radius:13px;padding:12px}
.total{font-size:20px;font-weight:800;color:var(--pink)}
.archive-month{border:1px solid var(--line);padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.empty{text-align:center;padding:28px;color:var(--muted)}
.toast{position:fixed;right:16px;bottom:16px;background:#30252d;color:#fff;padding:12px 15px;border-radius:12px;z-index:30}
@media(max-width:900px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){.app{padding:10px}.header h1{font-size:18px}.logo{width:58px;height:58px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,1fr)}.checks{grid-template-columns:1fr 1fr}.topbar .btn{flex:1}}
@media print{
  body{background:#fff}.app>*:not(#receiptPrint){display:none!important}#receiptPrint{display:block!important}
}
#receiptPrint{display:none}
@page{size:80mm auto;margin:0}
.receipt{width:80mm;padding:7mm 5mm;font-family:Arial,Helvetica,sans-serif;color:#111;font-size:11px}
.receipt-logo{width:42mm;height:42mm;object-fit:contain;display:block;margin:0 auto 2mm}
.receipt-title{text-align:center;font-size:15px;font-weight:800}.receipt-sub{text-align:center;font-size:9px;margin-bottom:4mm}
.receipt-line{border-top:1px dashed #333;margin:3mm 0}.rrow{display:flex;justify-content:space-between;gap:8px;margin:1.5mm 0}.rrow span:first-child{color:#333}.rstrong{font-weight:800;font-size:13px}.receipt-center{text-align:center}.receipt-small{font-size:9px}
</style>
</head>

    <div><h1>ZR Creative Studio</h1><p>Order & Production System</p></div>

  <div class="topbar">

    <h2>ðŸ“‹ Order Aktif</h2>
    <div class="filters">
      <input id="search" class="search" placeholder="Cari nomor, customer, WhatsApp, produk..." oninput="renderOrders()">
      <select id="monthFilter" onchange="renderOrders()"></select>
      <select id="statusFilter" onchange="renderOrders()">
        <option value="">Semua Status</option><option>Menunggu</option><option>Produksi</option><option>Finishing</option><option>QC</option><option>Selesai</option><option>Diambil / Dikirim</option>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="receiptPrint"></div>

<script>
const LOGO_SRC = document.querySelector(".logo").src;
let orders = JSON.parse(localStorage.getItem("zrOrdersFinal") || "[]");
let archives = JSON.parse(localStorage.getItem("zrArchivesFinal") || "[]");
let editingId = null;

const products = ["Buku Tulis Custom","Jurnal Ramadhan","Buku Kontrol Tahsin/Tahfidz","Buku Doa & Hadis","Flash Card","Bookmark","Undangan","Souvenir","Paperbag","Calendar"];
const statuses = ["Menunggu","Produksi","Finishing","QC","Selesai","Diambil / Dikirim"];
const checkNames = ["File Final","Cetak","Potong","Finishing / Jilid","QC","Packing"];

function saveAll(){localStorage.setItem("zrOrdersFinal",JSON.stringify(orders));localStorage.setItem("zrArchivesFinal",JSON.stringify(archives));}
function money(n){return "Rp"+Number(n||0).toLocaleString("id-ID")}
function dateID(s){if(!s)return "-";let d=new Date(s+"T00:00:00");return d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"})}
function monthKey(s){return (s||"").slice(0,7)}
function monthLabel(key){if(!key)return "Semua Bulan";let [y,m]=key.split("-");return new Date(+y,+m-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"})}
function getNextNumber(){
  const now=new Date(), key=now.toISOString().slice(0,7), month=String(now.getMonth()+1).padStart(3,"0"), prefix=`ZR-${month}-`;
  const nums=orders.concat(archives).map(o=>o.number||"").filter(n=>n.startsWith(prefix)).map(n=>parseInt(n.slice(prefix.length),10)).filter(n=>!isNaN(n));
  return prefix+String(nums.length?Math.max(...nums)+1:1).padStart(4,"0");
}
function statusClass(s){return {"Menunggu":"st-menunggu","Produksi":"st-produksi","Finishing":"st-finishing","QC":"st-qc","Selesai":"st-selesai","Diambil / Dikirim":"st-kirim"}[s]||"st-menunggu"}
function today(){return new Date().toISOString().slice(0,10)}

function renderStats(){
  const counts={Total:orders.length,Menunggu:0,Produksi:0,Finishing:0,QC:0,Selesai:0,"Diambil / Dikirim":0};
  orders.forEach(o=>counts[o.status]=(counts[o.status]||0)+1);
  document.getElementById("stats").innerHTML=Object.entries(counts).map(([k,v])=>`<div class="card"><div class="num">${v}</div><div class="lbl">${k}</div></div>`).join("");
}
function renderMonthFilter(){
  const keys=[...new Set(orders.map(o=>monthKey(o.orderDate)).filter(Boolean))].sort().reverse();
  const sel=document.getElementById("monthFilter"), old=sel.value;
  sel.innerHTML='<option value="">Semua Bulan</option>'+keys.map(k=>`<option value="${k}">${monthLabel(k)}</option>`).join("");
  if(keys.includes(old))sel.value=old;
}
function renderOrders(){
  renderStats();renderMonthFilter();
  const q=(document.getElementById("search").value||"").toLowerCase(), mk=document.getElementById("monthFilter").value, sf=document.getElementById("statusFilter").value;
  const list=orders.filter(o=>(!mk||monthKey(o.orderDate)===mk)&&(!sf||o.status===sf)&&(!q||[o.number,o.customer,o.whatsapp,o.product].join(" ").toLowerCase().includes(q)));
  const box=document.getElementById("orderList");
  if(!list.length){box.innerHTML='<div class="empty">Belum ada order yang sesuai.</div>';return}
  box.innerHTML=list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(o=>`
    <div class="order">
      <div class="orderhead"><div><div class="orderno">${o.number}</div><b>${esc(o.customer)}</b><div class="note">${esc(o.product)} Â· ${o.qty} ${esc(o.unit)}</div></div><span class="badge ${statusClass(o.status)}">${o.status}</span></div>
      <div class="meta">
        <div><b>Tanggal Order</b>${dateID(o.orderDate)}</div><div><b>Deadline</b>${o.deadline?dateID(o.deadline):"<span style=\"color:#999\">Belum ditentukan</span>"}</div>
        <div><b>Total</b><span class="money">${money(o.total)}</span></div><div><b>Sisa</b><span class="money">${money(o.remaining)}</span></div>
      </div>
      <div class="actions">
        <button class="btn small secondary" onclick="detailOrder('${o.id}')">ðŸ‘ï¸ Detail</button>
        <button class="btn small secondary" onclick="openForm('${o.id}')">âœï¸ Edit</button>
        <button class="btn small dark" onclick="printReceipt('${o.id}')">ðŸ§¾ Struk</button>
        <button class="btn small secondary" onclick="archiveOrder('${o.id}')">ðŸ“© Arsipkan</button>
        <button class="btn small danger" onclick="deleteOrder('${o.id}')">ðŸ—‘ï¸ Hapus</button>
      </div>
    </div>`).join("");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function openForm(id=null){
  editingId=id;
  const o=id?orders.find(x=>x.id===id):null;
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modalBox").innerHTML=`
    <h2>${o?"âœï¸ Edit Order":"âž• Order Baru"}</h2>
    <div class="grid">
      <div class="field"><label>Nomor Order</label><input id="f_number" value="${o?o.number:getNextNumber()}" readonly></div>
      <div class="field"><label>Tanggal Order</label><input id="f_orderDate" type="date" value="${o?.orderDate||today()}"></div>
      <div class="field"><label>Nama Customer</label><input id="f_customer" value="${esc(o?.customer||"")}" placeholder="Nama customer"></div>
      <div class="field"><label>WhatsApp</label><input id="f_whatsapp" value="${esc(o?.whatsapp||"")}" placeholder="08xxxxxxxxxx"></div>
      <div class="field"><label>Produk</label><select id="f_product" onchange="toggleManual()"><option value="">Pilih produk</option>${products.map(p=>`<option ${o?.product===p?"selected":""}>${p}</option>`).join("")}<option value="__manual__">ï¼‹ Produk Lainnya / Ketik Manual</option></select></div>
      <div class="field ${o?.manualProduct?"":"hidden"}" id="manualWrap"><label>Nama Produk Manual</label><input id="f_manual" value="${esc(o?.manualProduct||"")}" placeholder="Nama produk"></div>
      <div class="field"><label>Qty</label><input id="f_qty" type="number" min="0" value="${o?.qty||1}" oninput="calc()"></div>
      <div class="field"><label>Jenis Harga / Satuan</label><select id="f_unit" onchange="calc()"><option>Satuan / pcs</option><option>Pak</option><option>Lusin</option><option>Set</option><option>Lainnya</option></select></div>
      <div class="field"><label>Harga per satuan/pak/lusin</label><input id="f_price" type="number" min="0" value="${o?.price||0}" oninput="calc()"></div>
      <div class="field"><label>Deadline</label><input id="f_deadline" type="date" value="${o?.deadline||""}"></div>
      <div class="field"><label>Diskon</label><select id="f_discountType" onchange="calc()"><option value="none">Tidak Ada</option><option value="percent">Persentase (%)</option><option value="nominal">Nominal (Rp)</option></select></div>
      <div class="field"><label id="discLabel">Nilai Diskon</label><input id="f_discount" type="number" min="0" value="${o?.discountValue||0}" oninput="calc()"></div>
      <div class="field"><label>DP / Sudah Dibayar</label><input id="f_dp" type="number" min="0" value="${o?.dp||0}" oninput="calc()"></div>
      <div class="field"><label>Metode Pembayaran</label><select id="f_payment" onchange="togglePayment()"><option>Transfer</option><option>QRIS</option><option>Tunai</option><option value="__manual__">Lainnya</option></select></div>
      <div class="field hidden" id="paymentWrap"><label>Metode Pembayaran Lainnya</label><input id="f_manualPayment" value="${esc(o?.manualPayment||"")}" placeholder="Contoh: ShopeePay"></div>
      <div class="field"><label>Status Order</label><select id="f_status">${statuses.map(s=>`<option ${o?.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field full"><div class="summary" id="calcBox"></div></div>
      <div class="field full"><label>Checklist Produksi (Internal ZR)</label><div class="checks">${checkNames.map((c,i)=>`<label class="check"><input type="checkbox" id="c${i}" ${o?.checks?.[i]?"checked":""}>${c}</label>`).join("")}</div></div>
      <div class="field full"><label>Catatan</label><textarea id="f_notes" placeholder="Catatan order/produksi...">${esc(o?.notes||"")}</textarea></div>
    </div>
    <div class="actions"><button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveOrder()">ðŸ’¾ ${o?"Simpan Perubahan":"Simpan Order"}</button></div>`;
  if(o){
    const sel=document.getElementById("f_unit");sel.value=o.unit||"Satuan / pcs";
    document.getElementById("f_discountType").value=o.discountType||"none";
    const pay=document.getElementById("f_payment");pay.value=o.paymentManual?"__manual__":(o.payment||"Transfer");
  }
  toggleManual();togglePayment();calc();
}
function toggleManual(){const v=document.getElementById("f_product").value,w=document.getElementById("manualWrap");w.classList.toggle("hidden",v!=="__manual__")}
function togglePayment(){const v=document.getElementById("f_payment").value;document.getElementById("paymentWrap").classList.toggle("hidden",v!=="__manual__")}
function calc(){
  const qty=+document.getElementById("f_qty").value||0, price=+document.getElementById("f_price").value||0, sub=qty*price;
  const dt=document.getElementById("f_discountType").value, dv=+document.getElementById("f_discount").value||0;
  let disc=dt==="percent"?sub*Math.min(dv,100)/100:dt==="nominal"?Math.min(dv,sub):0;
  const total=Math.max(0,sub-disc),dp=Math.min(+document.getElementById("f_dp").value||0,total),rem=total-dp;
  document.getElementById("discLabel").textContent=dt==="percent"?"Diskon (%)":dt==="nominal"?"Diskon (Rp)":"Nilai Diskon";
  document.getElementById("calcBox").innerHTML=`<div class="rrow"><span>Subtotal</span><b>${money(sub)}</b></div><div class="rrow"><span>Diskon</span><b>-${money(disc)}</b></div><div class="rrow total"><span>Total</span><span>${money(total)}</span></div><div class="rrow"><span>DP</span><b>${money(dp)}</b></div><div class="rrow"><span>Sisa</span><b>${money(rem)}</b></div>`;
  return {qty,price,sub,dt,dv,disc,total,dp,rem};
}
function saveOrder(){
  const c=calc(), productSel=document.getElementById("f_product").value, manual=productSel==="__manual__"?document.getElementById("f_manual").value.trim():"";
  const product=productSel==="__manual__"?manual:productSel;
  if(!document.getElementById("f_customer").value.trim()||!product){alert("Nama customer dan produk wajib diisi.");return}
  const deadline=document.getElementById("f_deadline").value;
  if(!deadline){alert("Deadline wajib diisi.");document.getElementById("f_deadline").focus();return}
  const paySel=document.getElementById("f_payment").value, manualPayment=paySel==="__manual__"?document.getElementById("f_manualPayment").value.trim():"";
  const old=editingId?orders.find(x=>x.id===editingId):null;
  const obj={id:editingId||crypto.randomUUID(),number:document.getElementById("f_number").value,orderDate:document.getElementById("f_orderDate").value,deadline,customer:document.getElementById("f_customer").value.trim(),whatsapp:document.getElementById("f_whatsapp").value.trim(),product,manualProduct:manual,qty:c.qty,unit:document.getElementById("f_unit").value,price:c.price,subtotal:c.sub,discountType:c.dt,discountValue:c.dv,discount:c.disc,total:c.total,dp:c.dp,remaining:c.rem,payment:paySel==="__manual__"?"Lainnya":paySel,manualPayment, status:document.getElementById("f_status").value,checks:checkNames.map((_,i)=>document.getElementById("c"+i).checked),notes:document.getElementById("f_notes").value,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
  if(editingId){orders=orders.map(x=>x.id===editingId?obj:x)}else orders.push(obj);
  saveAll();closeModal();renderOrders();showSuccess(obj);
}
function showSuccess(o){
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modalBox").innerHTML=`<div class="success"><div class="big">ðŸŽ‰</div><h2>Order Berhasil Disimpan!</h2><p>Nomor Order</p><div class="orderno" style="font-size:25px">${o.number}</div><p><b>${esc(o.customer)}</b><br>${esc(o.product)}</p><button class="btn primary" onclick="closeModal()">OK</button></div>`;
}
function closeModal(){document.getElementById("modal").classList.add("hidden");editingId=null}
function detailOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modalBox").innerHTML=`<h2>ðŸ“‹ Detail Order</h2><div class="summary"><div class="orderno">${o.number}</div><p><b>${esc(o.customer)}</b> Â· ${esc(o.whatsapp||"-")}</p><p>${esc(o.product)} Â· ${o.qty} ${esc(o.unit)}</p><p>Tanggal: ${dateID(o.orderDate)} Â· Deadline: ${o.deadline?dateID(o.deadline):"Belum ditentukan"}</p><p>Total: <b>${money(o.total)}</b> Â· DP: ${money(o.dp)} Â· Sisa: <b>${money(o.remaining)}</b></p><p>Pembayaran: ${esc(o.manualPayment||o.payment)}</p><p>Status: <span class="badge ${statusClass(o.status)}">${o.status}</span></p></div><h3>Checklist Produksi</h3><div class="checks">${checkNames.map((c,i)=>`<div class="check">${o.checks?.[i]?"â˜‘ï¸":"â˜"} ${c}</div>`).join("")}</div><h3>Catatan</h3><div class="summary">${esc(o.notes||"-")}</div><div class="actions"><button class="btn primary" onclick="shareStatus('${o.id}')">ðŸ“¸ Bagikan Status</button><button class="btn dark" onclick="printReceipt('${o.id}')">ðŸ§¾ Cetak Struk</button><button class="btn secondary" onclick="openForm('${o.id}')">âœï¸ Edit</button><button class="btn secondary" onclick="closeModal()">Tutup</button></div>`;
}
function shareStatus(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const text=`ZR CREATIVE STUDIO\\nOrder: ${o.number}\\nCustomer: ${o.customer}\\nProduk: ${o.product}\\nStatus: ${o.status}\\n\\n${checkNames.map((c,i)=>(o.checks?.[i]?"â˜‘":"â˜")+" "+c).join("\\n")}`;
  if(navigator.share)navigator.share({title:"Status Order "+o.number,text});else{navigator.clipboard?.writeText(text);alert("Status sudah disalin. Kamu bisa tempel ke WhatsApp.");}
}
function deleteOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  if(confirm(`Hapus order ${o.number}?\\nData tidak dapat dikembalikan.`)){orders=orders.filter(x=>x.id!==id);saveAll();renderOrders()}
}
function archiveOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  if(confirm(`Arsipkan ${o.number} ke Arsip ${monthLabel(monthKey(o.orderDate))}?`)){archives.push({...o,archivedAt:new Date().toISOString()});orders=orders.filter(x=>x.id!==id);saveAll();renderOrders()}
}
function openArchive(){
  document.getElementById("modal").classList.remove("hidden");
  const groups={};archives.forEach(o=>{const k=monthKey(o.orderDate)||"Tanpa Bulan";(groups[k]??=[]).push(o)});
  const keys=Object.keys(groups).sort().reverse();
  document.getElementById("modalBox").innerHTML=`<h2>ðŸ“© Arsip Order</h2>${keys.length?keys.map(k=>`<div class="archive-month"><div><b>ðŸ“ ${monthLabel(k)}</b><div class="note">${groups[k].length} order</div></div><button class="btn small secondary" onclick="viewArchiveMonth('${k}')">Buka</button></div>`).join(""):'<div class="empty">Belum ada arsip.</div>'}<div class="actions"><button class="btn secondary" onclick="closeModal()">Tutup</button></div>`;
}
function viewArchiveMonth(k){
  const list=archives.filter(o=>monthKey(o.orderDate)===k);
  document.getElementById("modalBox").innerHTML=`<h2>ðŸ“ Arsip ${monthLabel(k)}</h2>${list.map(o=>`<div class="order"><div class="orderhead"><div><div class="orderno">${o.number}</div><b>${esc(o.customer)}</b><div class="note">${esc(o.product)} Â· ${o.qty} ${esc(o.unit)}</div></div><span class="badge ${statusClass(o.status)}">${o.status}</span></div><div class="actions"><button class="btn small dark" onclick="printReceipt('${o.id}',true)">ðŸ§¾ Struk</button><button class="btn small secondary" onclick="restoreArchive('${o.id}')">â†©ï¸ Kembalikan</button></div></div>`).join("")}<div class="actions"><button class="btn secondary" onclick="openArchive()">Kembali</button></div>`;
}
function restoreArchive(id){
  const i=archives.findIndex(x=>x.id===id);if(i<0)return;
  orders.push(archives[i]);archives.splice(i,1);saveAll();openArchive();renderOrders();
}
function openReport(){
  const by={};orders.concat(archives).forEach(o=>{const k=monthKey(o.orderDate)||"Tanpa Bulan";if(!by[k])by[k]={count:0,total:0,dp:0,remaining:0};by[k].count++;by[k].total+=+o.total||0;by[k].dp+=+o.dp||0;by[k].remaining+=+o.remaining||0});
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modalBox").innerHTML=`<h2>ðŸ“Š Laporan</h2><p class="note">Gabungan order aktif + arsip.</p>${Object.keys(by).sort().reverse().map(k=>`<div class="archive-month"><div><b>${monthLabel(k)}</b><div class="note">${by[k].count} order Â· Omzet ${money(by[k].total)}</div><div class="note">DP ${money(by[k].dp)} Â· Sisa ${money(by[k].remaining)}</div></div><button class="btn small green" onclick="exportMonth('${k}')">ðŸ“¤ Export</button></div>`).join("")}<div class="actions"><button class="btn secondary" onclick="closeModal()">Tutup</button></div>`;
}
function exportMonth(k){
  const list=orders.concat(archives).filter(o=>monthKey(o.orderDate)===k);
  if(!list.length)return;
  const headers=["Nomor Order","Tanggal Order","Customer","WhatsApp","Produk","Qty","Satuan","Harga","Subtotal","Jenis Diskon","Nilai Diskon","Diskon Rp","Total","DP","Sisa","Metode Pembayaran","Status","Deadline","Catatan"];
  const rows=list.map(o=>[o.number,o.orderDate,o.customer,o.whatsapp,o.product,o.qty,o.unit,o.price,o.subtotal,o.discountType,o.discountValue,o.discount,o.total,o.dp,o.remaining,o.manualPayment||o.payment,o.status,o.deadline,o.notes]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\\n");
  const blob=new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ZR_Order_${k}.csv`;a.click();URL.revokeObjectURL(a.href);
}
function focusSearch(){document.getElementById("search").focus();document.getElementById("search").scrollIntoView({behavior:"smooth",block:"center"})}

function printReceipt(id,fromArchive=false){
  const o=(fromArchive?archives:orders).find(x=>x.id===id)||orders.find(x=>x.id===id)||archives.find(x=>x.id===id);if(!o)return;
  const pay=o.manualPayment||o.payment;
  document.getElementById("receiptPrint").innerHTML=`<div class="receipt"><img class="receipt-logo" src="${LOGO_SRC}"><div class="receipt-title">ZR CREATIVE STUDIO</div><div class="receipt-sub">ORDER & PAYMENT RECEIPT</div><div class="receipt-line"></div><div class="rrow"><span>NOMOR ORDER</span><b>${esc(o.number)}</b></div><div class="rrow"><span>Tanggal</span><span>${dateID(o.orderDate)}</span></div><div class="rrow"><span>Customer</span><span>${esc(o.customer)}</span></div><div class="rrow"><span>WhatsApp</span><span>${esc(o.whatsapp||"-")}</span></div><div class="receipt-line"></div><b>DETAIL PESANAN</b><div class="rrow"><span>${esc(o.product)}</span><span>${o.qty} ${esc(o.unit)}</span></div><div class="rrow"><span>${money(o.price)} / ${esc(o.unit)}</span><span>${money(o.subtotal)}</span></div>${o.discount?`<div class="rrow"><span>Diskon</span><span>-${money(o.discount)}</span></div>`:""}<div class="receipt-line"></div><div class="rrow rstrong"><span>TOTAL</span><span>${money(o.total)}</span></div><div class="rrow"><span>DP</span><span>${money(o.dp)}</span></div><div class="rrow rstrong"><span>SISA</span><span>${money(o.remaining)}</span></div><div class="rrow"><span>Pembayaran</span><span>${esc(pay)}</span></div><div class="rrow"><span>Status</span><span>${esc(o.status)}</span></div>${o.deadline?`<div class="rrow"><span>Deadline</span><span>${o.deadline?dateID(o.deadline):"Belum ditentukan"}</span></div>`:""}${o.notes?`<div class="receipt-line"></div><div class="receipt-small"><b>Catatan:</b><br>${esc(o.notes)}</div>`:""}<div class="receipt-line"></div><div class="receipt-center">Terima kasih telah berbelanja<br>di ZR Creative Studio â¤ï¸<br><span class="receipt-small">Simpan nota ini sebagai bukti transaksi.</span></div></div>`;
  closeModal();setTimeout(()=>window.print(),80);
}

renderOrders();
</script>
</body>
