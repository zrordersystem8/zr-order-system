<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZR Creative Studio - Order System</title>
<style>
:root{--pink:#d92d73;--pink2:#f05a9d;--soft:#fff2f7;--ink:#29212a;--muted:#756b75;--line:#eadfe5;--green:#1f9d62;--orange:#e58b22;--red:#d63b3b;--white:#fff;--shadow:0 8px 24px rgba(72,31,52,.08)}
*{box-sizing:border-box}body{margin:0;background:#fff8fb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1200px;margin:auto;padding:16px}.header{background:linear-gradient(135deg,#fff,#ffeaf3);border:1px solid #f2d5e1;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #111}.header h1{font-size:21px;margin:0 0 4px}.header p{margin:0;color:var(--muted);font-size:13px}
.topbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:700}.primary{background:var(--pink);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.dark{background:#30252d;color:#fff}.green{background:var(--green);color:#fff}.danger{background:#fff0f0;color:var(--red);border:1px solid #f0cccc}
.cards{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:16px}.stat-card{cursor:pointer;transition:.15s;border:2px solid transparent}.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(72,31,52,.14)}.stat-card:active{transform:scale(.97)}.stat-total{background:#ffd6e8!important;border:2px solid #ef8fba!important;color:#7d1747!important}.stat-menunggu{background:#fff0a8!important;border:2px solid #e5c43e!important;color:#735d00!important}.stat-produksi{background:#cfe3ff!important;border:2px solid #7caeea!important;color:#245b9e!important}.stat-finishing{background:#ffe0bd!important;border:2px solid #eea65a!important;color:#8a4d0a!important}.stat-qc{background:#e7d4ff!important;border:2px solid #b58be5!important;color:#663a94!important}.stat-selesai{background:#d2f2df!important;border:2px solid #7bc798!important;color:#21663a!important}.stat-dikirim{background:#cff3f1!important;border:2px solid #75cbc6!important;color:#176763!important}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow)}.card .num{font-size:22px;font-weight:800}.card .lbl{font-size:11px;color:var(--muted);margin-top:3px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 14px}.filters{display:flex;gap:9px;flex-wrap:wrap}.filters input,.filters select{flex:1;min-width:190px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:var(--muted)}
.order{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}.orderhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order .num{font-size:18px;font-weight:800;color:var(--pink)}.muted{color:var(--muted);font-size:12px}.price-pending{color:#a36b00;font-weight:800}.price-set{color:var(--green);font-weight:800}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2f5ff;font-size:11px;font-weight:700}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.meta div{background:#fff8fb;border-radius:10px;padding:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.small{padding:8px 10px;font-size:12px}
.product-row{display:grid;grid-template-columns:2fr .7fr .9fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding:10px;background:#fff8fb;border:1px solid var(--line);border-radius:12px}.subtotal{font-weight:800;padding:11px 4px;text-align:right}
.totalbox{background:#fff7fa;border:1px solid #f2d5e1;border-radius:14px;padding:13px;margin-top:12px}.totalline{display:flex;justify-content:space-between;padding:4px 0}.totalstrong{font-size:20px;font-weight:800;color:var(--pink)}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.check{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.check input{width:auto;margin-right:6px}
.modal{position:fixed;inset:0;background:rgba(35,20,29,.48);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.modalbox{background:#fff;border-radius:20px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:18px}.hidden{display:none!important}
.success{text-align:center;padding:25px}.success .big{font-size:38px;color:var(--pink);font-weight:800}.receipt{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.app{padding:10px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,1fr)}.product-row{grid-template-columns:1fr 1fr}.product-row .prod-main{grid-column:1/-1}.product-row .remove{grid-column:1/-1}}
@media print{body>*:not(#receiptPrint){display:none!important}#receiptPrint{display:block!important}@page{size:80mm auto;margin:0}}

.icon{width:20px;height:20px;display:inline-block;vertical-align:-4px;margin-right:7px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px}

</style>
</head>

const PRODUCTS=["Buku Tulis Custom","Jurnal Ramadhan","Buku Kontrol Tahsin/Tahfidz","Buku Doa & Hadis","Flash Card","Bookmark","Undangan","Souvenir","Paperbag","Calendar"];
const UNITS=["pcs","pak","lusin","set","grosir","lainnya"];
const STATUSES=["Menunggu","Produksi","Finishing","QC","Selesai","Diambil / Dikirim"];
let orders=JSON.parse(localStorage.getItem("zrOrdersMulti")||"[]");
let archives=JSON.parse(localStorage.getItem("zrArchivesMulti")||"[]");
let editingId=null;
const $=id=>document.getElementById(id);
function saveData(){localStorage.setItem("zrOrdersMulti",JSON.stringify(orders));localStorage.setItem("zrArchivesMulti",JSON.stringify(archives))}
function pad(n,l){return String(n).padStart(l,"0")}
function isoToday(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2)}
function fmtDate(s){if(!s)return"Belum ditentukan";const [y,m,d]=s.split("-");return d+"/"+m+"/"+y}
function rupiah(n){return"Rp"+Number(n||0).toLocaleString("id-ID")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function orderPrefix(dateStr=isoToday()){const parts=String(dateStr||isoToday()).split("-");const y=parts[0]||String(new Date().getFullYear());const m=pad(Number(parts[1]||1),3);return "ZR-"+y.slice(-2)+m+"-"}
function getNextNumber(dateStr=isoToday()){const prefix=orderPrefix(dateStr);const nums=[...orders,...archives].map(o=>o.number||"").filter(n=>n.startsWith(prefix)).map(n=>parseInt(n.slice(prefix.length),10)).filter(Number.isFinite);return prefix+pad(nums.length?Math.max(...nums)+1:1,4)}
function updateNewOrderNumber(){if(editingId)return;const date=$("fDate")?.value||isoToday();if($("fNumber"))$("fNumber").value=getNextNumber(date)}
function getAll(){return[...orders,...archives]}
function productSubtotal(p){return Number(p.qty||0)*Number(p.price||0)}
function orderSubtotal(o){return(o.items||[]).reduce((s,p)=>s+productSubtotal(p),0)}
function discountValue(o,sub){return o.discountType==="percent"?sub*Number(o.discount||0)/100:o.discountType==="nominal"?Math.min(sub,Number(o.discount||0)):0}
function pricePending(o){return o?.priceStatus==="pending"}
function totalValue(o){if(pricePending(o))return null;const sub=orderSubtotal(o);return Math.max(0,sub-discountValue(o,sub))}
function money(v){return v==null?"Belum ditentukan":rupiah(v)}
function remainingValue(o){const t=totalValue(o);return t==null?null:Math.max(0,t-Number(o.dp||0))}
function productLabel(p){return p.product==="__manual__"?(p.manual||"Produk Lainnya"):p.product}
function openNewOrder(){editingId=null;openOrderForm()}
function openOrderForm(o=null){
editingId=o?.id||null;
const x=o||{number:getNextNumber(isoToday()),orderDate:isoToday(),deadline:"",customer:"",whatsapp:"",items:[{product:PRODUCTS[0],manual:"",qty:1,unit:"pcs",price:0}],priceStatus:"pending",discountType:"none",discount:0,dp:0,paymentMethod:"Transfer",paymentOther:"",shippingStatus:"Belum Dikirim",courier:"",tracking:"",driver:"",driverPhone:"",status:"Menunggu",checks:{design:false,file:false,print:false,cut:false,finish:false,qc:false,pack:false},notes:""};
$("modalBox").innerHTML=`<h2>${editingId?"Edit Order":"Order Baru"}</h2>
<div class="grid3"><div class="field"><label>Nomor Order</label><input id="fNumber" value="${esc(x.number)}" disabled></div><div class="field"><label>Tanggal Order</label><input id="fDate" type="date" value="${x.orderDate||isoToday()}" onchange="updateNewOrderNumber()"></div><div class="field"><label>Deadline *</label><input id="fDeadline" type="date" value="${x.deadline||""}"></div></div>
<div class="grid2" style="margin-top:12px"><div class="field"><label>Customer</label><input id="fCustomer" value="${esc(x.customer)}"></div><div class="field"><label>WhatsApp</label><input id="fWA" value="${esc(x.whatsapp)}"></div></div>
<div class="panel" style="margin-top:14px;padding:12px"><h2 style="margin-bottom:10px">Daftar Produk</h2><div id="itemsBox"></div><button class="btn secondary small" onclick="addItemRow()">+ Tambah Produk</button></div>
<div class="grid3"><div class="field"><label>Status Harga</label><select id="fPriceStatus" onchange="togglePriceStatus()"><option value="pending">Belum Ditentukan</option><option value="set">Sudah Ditentukan</option></select></div><div class="field"><label>Diskon</label><select id="fDiscType" onchange="calcForm()"><option value="none">Tidak Ada</option><option value="percent">Persentase (%)</option><option value="nominal">Nominal (Rp)</option></select></div><div class="field"><label>Nilai Diskon</label><input id="fDisc" type="number" min="0" value="${x.discount||0}" oninput="calcForm()"></div></div><div class="grid3" style="margin-top:10px"><div class="field"><label>DP</label><input id="fDP" type="number" min="0" value="${x.dp||0}" oninput="calcForm()"></div><div></div><div></div></div>
<div class="grid3" style="margin-top:12px"><div class="field"><label>Metode Pembayaran</label><select id="fPay" onchange="toggleOtherPay()"><option>Transfer</option><option>QRIS</option><option>Tunai</option><option>Lainnya</option></select></div><div class="field hidden" id="otherPayWrap"><label>Pembayaran Lainnya</label><input id="fPayOther" value="${esc(x.paymentOther||"")}"></div><div class="field"><label>Status</label><select id="fStatus">${STATUSES.map(s=>`<option>${s}</option>`).join("")}</select></div></div>
<div class="panel" style="margin-top:12px;padding:12px">
<h2 style="margin-bottom:10px">Pengiriman</h2>
<div class="grid3">
<div class="field"><label>Status Pengiriman</label><select id="fShipStatus" onchange="toggleShipping()"><option>Belum Dikirim</option><option>Dikirim</option><option>Diambil</option></select></div>
<div class="field"><label>Jasa Kirim</label><select id="fCourier" onchange="toggleShipping()"><option value="">Pilih</option><option>Shopee</option><option>TikTok Shop</option><option>J&T</option><option>JNE</option><option>SiCepat</option><option>SPX</option><option>OJOL</option><option>Lainnya</option></select></div>
<div class="field"><label>No. Resi / ID Pengiriman</label><input id="fTracking" value="${esc(x.tracking||"")}" placeholder="Opsional"></div>
</div>
<div class="grid2" style="margin-top:10px" id="driverWrap">
<div class="field"><label>Nama Driver OJOL</label><input id="fDriver" value="${esc(x.driver||"")}" placeholder="Opsional"></div>
<div class="field"><label>No. HP Driver</label><input id="fDriverPhone" value="${esc(x.driverPhone||"")}" placeholder="Opsional"></div>
</div>
</div>
<div class="totalbox"><div class="totalline"><span>Subtotal</span><b id="sumSub">Rp0</b></div><div class="totalline"><span>Diskon</span><b id="sumDisc">Rp0</b></div><div class="totalline totalstrong"><span>Total</span><span id="sumTotal">Rp0</span></div><div class="totalline"><span>DP</span><b id="sumDP">Rp0</b></div><div class="totalline"><span>Sisa</span><b id="sumRemain">Rp0</b></div></div>
<div class="panel" style="margin-top:14px;padding:12px"><h2 style="margin-bottom:10px">Checklist Produksi (Internal)</h2><div class="checks"><label class="check"><input id="cDesign" type="checkbox"> Desain</label><label class="check"><input id="cFile" type="checkbox"> File Final</label><label class="check"><input id="cPrint" type="checkbox"> Cetak</label><label class="check"><input id="cCut" type="checkbox"> Cutting</label><label class="check"><input id="cFinish" type="checkbox"> Finishing / Jilid</label><label class="check"><input id="cQC" type="checkbox"> QC</label><label class="check"><input id="cPack" type="checkbox"> Packing</label></div></div>
<div class="field"><label>Catatan</label><textarea id="fNotes">${esc(x.notes||"")}</textarea></div>
<div class="actions"><button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveOrder()">Simpan Order</button></div>`;
$("fPriceStatus").value=x.priceStatus||((x.items||[]).some(p=>Number(p.price||0)>0)?"set":"pending");$("fDiscType").value=x.discountType||"none";$("fPay").value=x.paymentMethod||"Transfer";$("fStatus").value=x.status||"Menunggu";$("fShipStatus").value=x.shippingStatus||"Belum Dikirim";$("fCourier").value=x.courier||"";toggleShipping();
const checkIds={design:"cDesign",file:"cFile",print:"cPrint",cut:"cCut",finish:"cFinish",qc:"cQC",pack:"cPack"};["design","file","print","cut","finish","qc","pack"].forEach(k=>$(checkIds[k]).checked=!!x.checks?.[k]);
window._currentOrder=x;window._items=x.items?.map(p=>({...p}))||[];renderItemRows();toggleOtherPay();togglePriceStatus();calcForm();showModal()
}
function renderItemRows(){
$("itemsBox").innerHTML=window._items.map((p,i)=>`<div class="product-row">
<div class="field prod-main"><label>Produk</label><select onchange="itemChange(${i},'product',this.value)">${PRODUCTS.map(v=>`<option ${p.product===v?"selected":""} value="${esc(v)}">${esc(v)}</option>`).join("")}<option value="__manual__" ${p.product==="__manual__"?"selected":""}>Produk Lainnya / Ketik Manual</option></select>${p.product==="__manual__"?`<input style="margin-top:6px" placeholder="Nama produk" value="${esc(p.manual||"")}" oninput="itemChange(${i},'manual',this.value)">`:""}</div>
<div class="field"><label>Qty</label><input type="number" min="0" value="${p.qty}" oninput="itemChange(${i},'qty',this.value)"></div>
<div class="field"><label>Satuan</label><select onchange="itemChange(${i},'unit',this.value)">${UNITS.map(v=>`<option ${p.unit===v?"selected":""}>${v}</option>`).join("")}</select></div>
<div class="field"><label>Harga / unit</label><input type="number" min="0" value="${pricePending(window._currentOrder||{})?(p.price||""):p.price}" ${pricePending(window._currentOrder||{})?"disabled":""} oninput="itemChange(${i},'price',this.value)"></div>
<div class="field"><label>Subtotal</label><div class="subtotal" id="itemSub${i}">${pricePending(window._currentOrder||{})?"—":rupiah(productSubtotal(p))}</div></div>
<button class="btn danger small remove" onclick="removeItem(${i})" ${window._items.length===1?"disabled":""}>Hapus</button></div>`).join("")
}
function addItemRow(){window._items.push({product:PRODUCTS[0],manual:"",qty:1,unit:"pcs",price:0});renderItemRows();calcForm()}
function removeItem(i){if(window._items.length<=1)return;window._items.splice(i,1);renderItemRows();calcForm()}
function itemChange(i,k,v){
  if(k==="qty"||k==="price")v=Number(v||0);
  window._items[i][k]=v;
  if(k==="product"||k==="unit"){
    renderItemRows();
  }else{
    const subEl=$("itemSub"+i);
    if(subEl) subEl.textContent=rupiah(productSubtotal(window._items[i]));
  }
  calcForm();
